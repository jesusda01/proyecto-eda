<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura del pipeline de comercio electrónico</title>
<desc id="desc">Diez etapas ejecutadas secuencialmente, con estado compartido entre microlotes, persistencia en SQLite y servicio de recomendaciones y alertas.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#263640"/></pattern>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#14212b"/><stop offset="1" stop-color="#101a23"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#70cabe" stroke-width="1.3"/></marker>
</defs>
<style>
 text { font-family: 'Segoe UI',Arial,sans-serif; }
 .eyebrow { fill:#81ccbf; font-size:14px; letter-spacing:3px; font-weight:600; }
 .title { fill:#eff5f6; font-size:42px; font-weight:600; letter-spacing:-1.2px; }
 .muted { fill:#91a4b3; font-size:19px; }
 .small { fill:#8da2b2; font-size:16px; }
 .node-title { fill:#e8f0f4; font-size:23px; font-weight:600; letter-spacing:-0.4px; }
 .algo { fill:#8ed4ca; font-size:16px; }
 .body { fill:#a4b5c2; font-size:16px; }
 .number { fill:#7e95a5; font-size:17px; font-family:Consolas,monospace; }
 .connector { fill:none; stroke:#70cabe; stroke-width:1.8; marker-end:url(#arrow); }
</style>
<rect width="1600" height="1040" fill="#0a1118"/>
<rect x="0" y="190" width="1600" height="520" fill="url(#grid)" opacity="0.55"/>
<path d="M72 184H1528 M72 724H1528" stroke="#26343f"/>
<text x="72" y="62" class="eyebrow">ARQUITECTURA DEL SISTEMA / GRUPO 4</text>
<text x="72" y="122" class="title">Pipeline de comercio electrónico</text>
<text x="72" y="158" class="muted">Histórico incremental · diez etapas · estado conservado entre microlotes</text>
<text x="84" y="222" class="small">ENTRADA  /  CSV → Parquet → microlotes de eventos</text>
<text x="1516" y="222" class="small" text-anchor="end">EJECUCIÓN SECUENCIAL  /  00 → 09</text>

<path d="M348 324H370" class="connector"/>
<path d="M640 324H662" class="connector"/>
<path d="M932 324H954" class="connector"/>
<path d="M1224 324H1246" class="connector"/>
<path d="M1516 324H1534Q1552 324 1552 342V570Q1552 588 1534 588H1520" class="connector"/>
<path d="M1252 588H1230" class="connector"/>
<path d="M960 588H938" class="connector"/>
<path d="M668 588H646" class="connector"/>
<path d="M376 588H354" class="connector"/>
<text x="84" y="451" class="small">FLUJO DE DATOS</text>
<text x="304" y="451" class="body">Las etapas 3–9 utilizan el lote priorizado y las señales producidas durante la ejecución.</text>
<g><rect x="84" y="246" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="104" y="277" class="number">00</text>
<text x="104" y="309" class="node-title">Ingesta y buffer</text>
<text x="104" y="336" class="algo">FIFO · deque</text>
<text x="104" y="366" class="body">Recibir y entregar el lote</text>
<text x="104" y="388" class="small">La cola se vacía al consumirlo</text>
</g>
<g><rect x="376" y="246" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="396" y="277" class="number">01</text>
<text x="396" y="309" class="node-title">Preprocesamiento</text>
<text x="396" y="336" class="algo">Ordenación + búsqueda binaria</text>
<text x="396" y="366" class="body">Validar, limpiar y deduplicar</text>
<text x="396" y="388" class="small">Historial de IDs persistente</text>
</g>
<g><rect x="668" y="246" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="688" y="277" class="number">02</text>
<text x="688" y="309" class="node-title">Prioridades</text>
<text x="688" y="336" class="algo">Minheap estable</text>
<text x="688" y="366" class="body">Atender primero lo urgente</text>
<text x="688" y="388" class="small">Producir el lote priorizado</text>
</g>
<g><rect x="960" y="246" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="980" y="277" class="number">03</text>
<text x="980" y="309" class="node-title">Almacenamiento</text>
<text x="980" y="336" class="algo">Hash + LRU + SQLite</text>
<text x="980" y="366" class="body">Guardar y recuperar eventos</text>
<text x="980" y="388" class="small">Caché acotada en memoria</text>
</g>
<g><rect x="1252" y="246" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="1272" y="277" class="number">04</text>
<text x="1272" y="309" class="node-title">Índice por precio</text>
<text x="1272" y="336" class="algo">B+Tree en disco</text>
<text x="1272" y="366" class="body">Indexar catálogo de productos</text>
<text x="1272" y="388" class="small">Consultar intervalos de precio</text>
</g>
<g><rect x="1252" y="510" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="1272" y="541" class="number">05</text>
<text x="1272" y="573" class="node-title">Vecinos exactos</text>
<text x="1272" y="600" class="algo">KD-Tree + KNN de referencia</text>
<text x="1272" y="630" class="body">Comparar atributos de producto</text>
<text x="1272" y="652" class="small">Aportar candidatos al ranking</text>
</g>
<g><rect x="960" y="510" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="980" y="541" class="number">06</text>
<text x="1204" y="540" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#81ccbf">FIJA</text>
<text x="980" y="573" class="node-title">Riesgo y frecuencia</text>
<text x="980" y="600" class="algo">Bloom + Count-Min Sketch</text>
<text x="980" y="630" class="body">Ventana de 300 s · umbral 3</text>
<text x="980" y="652" class="small">Confirmar con estado exacto</text>
</g>
<g><rect x="668" y="510" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="688" y="541" class="number">07</text>
<text x="912" y="540" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#81ccbf">FIJA</text>
<text x="688" y="573" class="node-title">Similitud aproximada</text>
<text x="688" y="600" class="algo">MinHash + LSH · HNSW</text>
<text x="688" y="630" class="body">Canastas y vectores de producto</text>
<text x="688" y="652" class="small">Contrastar con métodos exactos</text>
</g>
<g><rect x="376" y="510" width="264" height="156" rx="12" fill="url(#card)" stroke="#30434f"/>
<text x="396" y="541" class="number">08</text>
<text x="620" y="540" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#81ccbf">FIJA</text>
<text x="396" y="573" class="node-title">Grafo de co-compra</text>
<text x="396" y="600" class="algo">PageRank + Louvain</text>
<text x="396" y="630" class="body">Relacionar compras por orden</text>
<text x="396" y="652" class="small">Influencia y comunidades</text>
</g>
<g><rect x="84" y="510" width="264" height="156" rx="12" fill="url(#card)" stroke="#50897f"/>
<text x="104" y="541" class="number">09</text>
<text x="104" y="573" class="node-title">Servicio y resultados</text>
<text x="104" y="600" class="algo">Top-K + Trie</text>
<text x="104" y="630" class="body">Recomendaciones explicadas</text>
<text x="104" y="652" class="small">Alertas y autocompletado</text>
</g>

<text x="84" y="700" class="small">Las alertas de revisión se almacenan; los eventos aceptados actualizan similitud, co-compra y resultados.</text>
<text x="72" y="765" class="eyebrow">ESTADO Y SALIDAS</text>
<path d="M568 796V944 M1064 796V944" stroke="#26343f"/>
<text x="84" y="818" font-size="22" font-weight="600" fill="#e8f0f4">Disco</text>
<text x="84" y="850" class="body">Eventos e historial de identificadores</text>
<text x="84" y="879" class="body">Páginas del B+Tree y membresía de órdenes</text>
<text x="84" y="917" class="small">SQLite · una carpeta por ejecución</text>
<text x="600" y="818" font-size="22" font-weight="600" fill="#e8f0f4">Memoria</text>
<text x="600" y="850" class="body">Catálogo, índices, filtros y grafo</text>
<text x="600" y="879" class="body">Las colas mantienen trabajo pendiente</text>
<text x="600" y="917" class="small">El estado crece con la población indexada</text>
<text x="1096" y="818" font-size="22" font-weight="600" fill="#e8f0f4">Servicio observable</text>
<text x="1096" y="850" class="body">Recomendaciones · alertas · popularidad</text>
<text x="1096" y="879" class="body">Consultas por rango y autocompletado</text>
<text x="1096" y="917" class="small">Visor web + resultados JSON + notebooks</text>
<path d="M72 967H1528" stroke="#26343f"/>
<text x="72" y="1002" class="small">UTEC · Estructuras de Datos y Algoritmos · 2026-2</text>
<text x="1528" y="1002" class="small" text-anchor="end">Órdenes y alertas del escenario: simulación identificada</text>
</svg>